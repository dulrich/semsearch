[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
edition = "2024"
license = "MIT"
publish = false
authors = ["David Ulrich <david@ulrichdev.com>"]
repository = "https://github.com/dulrich/semsearch"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }

[workspace.lints.rust]
unsafe_code = "deny"
